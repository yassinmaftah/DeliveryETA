services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deliveryeta_app
    ports:
      - "${PORT:-8503}:8501"
    volumes:
      - ./models:/workspace/models
      - ./docs/results:/workspace/docs/results
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped

  screenshots:
    image: mcr.microsoft.com/playwright/python:v1.49.1-jammy
    container_name: deliveryeta_screenshots
    depends_on:
      - web
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: >
      bash -c "pip install requests && python scripts/screenshots.py --url http://web:8501"
    profiles:
      - tools
